<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0E9E6E"/>
      <stop offset="1" stop-color="#0A6B57"/>
    </linearGradient>
    <linearGradient id="line" x1="96" y1="360" x2="416" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C9F7E5"/>
    </linearGradient>
  </defs>

  <!-- rounded app-icon background -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>

  <!-- subtle baseline grid -->
  <g stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="6" stroke-linecap="round">
    <line x1="96" y1="372" x2="416" y2="372"/>
  </g>

  <!-- area fill under the trend -->
  <path d="M96 332 L200 296 L300 318 L416 168 L416 372 L96 372 Z"
        fill="#FFFFFF" fill-opacity="0.12"/>

  <!-- upward trend line -->
  <path d="M96 332 L200 296 L300 318 L416 168"
        stroke="url(#line)" stroke-width="34"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- peak coin / data point -->
  <circle cx="416" cy="168" r="34" fill="#FFFFFF"/>
  <circle cx="416" cy="168" r="34" fill="#0E9E6E" fill-opacity="0.0" stroke="#0A6B57" stroke-width="0"/>
  <circle cx="416" cy="168" r="16" fill="#0E9E6E"/>
</svg>
