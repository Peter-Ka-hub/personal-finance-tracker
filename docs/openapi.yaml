openapi: 3.0.3
info:
  title: Personal Finance Tracker API
  version: 1.0.0
  description: >
    REST API exposed through the Nginx gateway under the `/api` prefix.
    Backed by three microservices: auth, categories and transactions.
  license:
    name: MIT
  contact:
    name: Peter-Ka-hub
    url: https://github.com/Peter-Ka-hub/personal-finance-tracker
servers:
  - url: https://ca-gateway.wonderfulsand-f41bf9c3.polandcentral.azurecontainerapps.io
    description: Live demo (Azure Container Apps)
  - url: http://localhost
    description: Local docker-compose

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AuthCredentials:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 50, example: alice }
        password: { type: string, minLength: 8, example: secret123 }
    AuthResponse:
      type: object
      properties:
        token: { type: string, description: JWT (HS256), valid 7 days }
        username: { type: string }
    Category:
      type: object
      required: [name, type]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        name: { type: string, maxLength: 50, example: Jedzenie }
        type: { type: string, enum: [income, expense] }
        color: { type: string, example: "#EF4444" }
        icon: { type: string, example: pizza }
        archivedAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: Archive timestamp. Active categories have no archive timestamp.
    Transaction:
      type: object
      required: [type, amount, categoryId, description, date]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        type: { type: string, enum: [income, expense] }
        amount:
          oneOf:
            - { type: number }
            - { type: string }
          example: "42.50"
        categoryId: { type: string, format: uuid }
        description: { type: string, maxLength: 255, example: Lunch }
        date: { type: string, format: date, example: "2026-06-02" }
    CreateTransaction:
      allOf:
        - $ref: '#/components/schemas/Transaction'
        - type: object
          properties:
            amount:
              description: Positive decimal amount from 0.01 to 99999999.99 with at most two fractional digits. Decimal strings may have surrounding whitespace.
              oneOf:
                - { type: number, minimum: 0.01, maximum: 99999999.99, multipleOf: 0.01 }
                - { type: string, pattern: '^\s*0*[0-9]{1,8}(\.[0-9]{1,2})?\s*$' }
            categoryId:
              type: string
              format: uuid
              description: Active category owned by the authenticated user and matching the transaction type.
    Error:
      type: object
      properties:
        message: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              path: { type: string }
              message: { type: string }

security:
  - bearerAuth: []

paths:
  /api/auth/register:
    post:
      tags: [auth]
      summary: Register a new user and receive a JWT
      description: If category initialization fails temporarily, it is retried at the next successful login.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthCredentials' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { description: Validation error or username taken, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: Too many requests (rate limited) }
  /api/auth/login:
    post:
      tags: [auth]
      summary: Log in and receive a JWT
      description: Retries pending default category initialization after verifying credentials.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthCredentials' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { description: Invalid credentials }
        '429': { description: Too many requests (rate limited) }

  /api/categories:
    get:
      tags: [categories]
      summary: List the authenticated user's active categories
      parameters:
        - name: includeArchived
          in: query
          schema: { type: boolean, default: false }
          description: Set to true to include archived labels and colors for transaction history and charts.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Category' } }
        '401': { description: Missing or invalid token }
    post:
      tags: [categories]
      summary: Create a category
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Category' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Category' } } } }
        '400': { description: Validation error }
        '401': { description: Missing or invalid token }
  /api/categories/{id}:
    delete:
      tags: [categories]
      summary: Archive an active owned category
      description: Existing transactions retain the category label. Archived categories cannot be used for new transactions.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Archived }
        '400': { description: Invalid UUID }
        '401': { description: Missing or invalid token }
        '404': { description: Not found, not owned or already archived }

  /api/transactions:
    get:
      tags: [transactions]
      summary: List the authenticated user's transactions
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Transaction' } }
        '401': { description: Missing or invalid token }
    post:
      tags: [transactions]
      summary: Create a transaction
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTransaction' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Transaction' } } } }
        '400': { description: Validation error or category unavailable for this transaction }
        '401': { description: Missing or invalid token }
  /api/transactions/{id}:
    delete:
      tags: [transactions]
      summary: Delete an owned transaction
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Deleted }
        '400': { description: Invalid UUID }
        '401': { description: Missing or invalid token }
        '404': { description: Not found / not owned }
