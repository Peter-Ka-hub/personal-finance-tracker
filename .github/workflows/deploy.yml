name: Deploy to Azure

on:
  push:
    branches: [master]
  workflow_dispatch:

# Only one deploy at a time per branch — avoids ARM DeploymentConflict when
# two pushes trigger overlapping base.bicep / apps.bicep runs.
concurrency:
  group: deploy-azure-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  # ── Gate: deploy only if unit tests pass ──────────────────────────────────────
  test:
    name: Unit tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        service: [auth, categories, transactions]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json
      - run: npm ci
        working-directory: services/${{ matrix.service }}
      - run: npm test
        working-directory: services/${{ matrix.service }}

  # ── Gate: full stack e2e through the gateway ─────────────────────────────────
  e2e:
    name: End-to-end (docker-compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create .env for docker-compose
        run: |
          cat > .env <<'EOF'
          DB_HOST=postgres
          DB_PORT=5432
          DB_USER=financeuser
          DB_PASSWORD=ci_test_password_123
          DB_NAME=financedb
          DB_SSL=false
          POSTGRES_MIGRATOR_PASSWORD=ci_test_migrator_password
          POSTGRES_AUTH_PASSWORD=ci_test_auth_db_password
          POSTGRES_CATEGORIES_PASSWORD=ci_test_categories_db_password
          POSTGRES_TRANSACTIONS_PASSWORD=ci_test_transactions_db_password
          JWT_SECRET=ci_jwt_secret_min_32_chars_aaaaaaaaaaaa
          INTERNAL_API_KEY=ci_internal_api_key_min_32_chars_bbbb
          EOF
      - name: Build and start the stack
        run: docker compose up -d --build
      - name: Run e2e tests
        run: node --test e2e/app.test.mjs
      - name: Test PostgreSQL migrations and roles
        run: bash db/test-migrations.sh
      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -n 300
      - name: Tear down
        if: always()
        run: docker compose down -v

  # ── Build images + deploy infra/apps to Azure ────────────────────────────────
  deploy:
    name: Build & deploy to Azure Container Apps
    needs: [test, e2e]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required deployment secrets
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          RESOURCE_GROUP: ${{ secrets.RESOURCE_GROUP }}
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          POSTGRES_MIGRATOR_PASSWORD: ${{ secrets.POSTGRES_MIGRATOR_PASSWORD }}
          POSTGRES_AUTH_PASSWORD: ${{ secrets.POSTGRES_AUTH_PASSWORD }}
          POSTGRES_CATEGORIES_PASSWORD: ${{ secrets.POSTGRES_CATEGORIES_PASSWORD }}
          POSTGRES_TRANSACTIONS_PASSWORD: ${{ secrets.POSTGRES_TRANSACTIONS_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
        run: |
          missing=0
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID RESOURCE_GROUP \
            POSTGRES_ADMIN_PASSWORD POSTGRES_MIGRATOR_PASSWORD POSTGRES_AUTH_PASSWORD \
            POSTGRES_CATEGORIES_PASSWORD POSTGRES_TRANSACTIONS_PASSWORD JWT_SECRET INTERNAL_API_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Check the legacy database secret transition
        env:
          RESOURCE_GROUP: ${{ secrets.RESOURCE_GROUP }}
          RETAIN_LEGACY_DB_SECRET: ${{ vars.RETAIN_LEGACY_DB_SECRET }}
        run: |
          case "$RETAIN_LEGACY_DB_SECRET" in
            true) exit 0 ;;
            ''|false) ;;
            *) echo "::error::RETAIN_LEGACY_DB_SECRET must be true or false"; exit 1 ;;
          esac
          apps=$(az containerapp list --resource-group "$RESOURCE_GROUP" \
            --query "[?name=='ca-auth' || name=='ca-categories' || name=='ca-transactions'].name" -o tsv)
          for app in $apps; do
            revisions=$(az containerapp revision list --name "$app" --resource-group "$RESOURCE_GROUP" -o json)
            legacy_in_use=$(jq 'any(.[] | select(.properties.active == true) | .properties.template.containers[]?.env[]?;
              .name == "DB_PASSWORD" and .secretRef == "db-password")' <<<"$revisions")
            if [[ "$legacy_in_use" == true ]]; then
              echo "::error::$app has an active revision using db-password. Set RETAIN_LEGACY_DB_SECRET=true before deploying."
              exit 1
            fi
          done

      # 1. Base infra (VNet, ACR, Postgres, Container Apps Env). Creates the ACR
      #    we push to in the next step. Idempotent on re-runs.
      - name: Deploy base infrastructure
        id: base
        env:
          RESOURCE_GROUP: ${{ secrets.RESOURCE_GROUP }}
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
        run: |
          params=$(mktemp "$RUNNER_TEMP/base-params.XXXXXX.json")
          trap 'rm -f "$params"' EXIT
          jq -n '{
            "$schema": "https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#",
            contentVersion: "1.0.0.0",
            parameters: {postgresAdminPassword: {value: env.POSTGRES_ADMIN_PASSWORD}}
          }' > "$params"
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name "base-${{ github.sha }}" \
            --template-file infra/base.bicep \
            --parameters "@$params" \
            --query properties.outputs -o json > base_outputs.json
          {
            echo "acrLoginServer=$(jq -r .acrLoginServer.value base_outputs.json)"
            echo "acrName=$(jq -r .acrName.value base_outputs.json)"
            echo "environmentId=$(jq -r .environmentId.value base_outputs.json)"
            echo "postgresHost=$(jq -r .postgresHost.value base_outputs.json)"
            echo "postgresDbName=$(jq -r .postgresDbName.value base_outputs.json)"
          } >> "$GITHUB_OUTPUT"

      # 2. Log in to ACR using its admin credentials (admin user enabled in
      #    registry.bicep — works with a Contributor-only identity).
      - name: Docker login to ACR
        run: |
          ACR_NAME="${{ steps.base.outputs.acrName }}"
          ACR_USER=$(az acr credential show -n "$ACR_NAME" --query username -o tsv)
          ACR_PW=$(az acr credential show -n "$ACR_NAME" --query 'passwords[0].value' -o tsv)
          printf '::add-mask::%s\n' "$ACR_PW"
          printf '%s\n' "$ACR_PW" | docker login "${{ steps.base.outputs.acrLoginServer }}" -u "$ACR_USER" --password-stdin

      # 3. Build release images and the one-shot migration image.
      - name: Build and push images
        env:
          ACR: ${{ steps.base.outputs.acrLoginServer }}
          TAG: ${{ github.sha }}
        run: |
          set -e
          for svc in auth categories transactions; do
            docker build "services/$svc" -t "$ACR/$svc:$TAG" -t "$ACR/$svc:latest"
            docker push "$ACR/$svc:$TAG"
            docker push "$ACR/$svc:latest"
          done
          docker build gateway -t "$ACR/gateway:$TAG" -t "$ACR/gateway:latest"
          docker push "$ACR/gateway:$TAG"
          docker push "$ACR/gateway:latest"
          docker build frontend --build-arg REACT_APP_API_URL=/api -t "$ACR/frontend:$TAG" -t "$ACR/frontend:latest"
          docker push "$ACR/frontend:$TAG"
          docker push "$ACR/frontend:latest"
          docker build db -t "$ACR/db-migrate:$TAG"
          docker push "$ACR/db-migrate:$TAG"

      - name: Run database migrations in Azure
        timeout-minutes: 12
        env:
          RESOURCE_GROUP: ${{ secrets.RESOURCE_GROUP }}
          POSTGRES_MIGRATOR_PASSWORD: ${{ secrets.POSTGRES_MIGRATOR_PASSWORD }}
        run: |
          params=$(mktemp "$RUNNER_TEMP/migrations-params.XXXXXX.json")
          trap 'rm -f "$params"' EXIT
          jq -n '{
            "$schema": "https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#",
            contentVersion: "1.0.0.0",
            parameters: {postgresMigratorPassword: {value: env.POSTGRES_MIGRATOR_PASSWORD}}
          }' > "$params"
          job=$(az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name "db-job-${{ github.sha }}" \
            --template-file infra/migrations.bicep \
            --parameters "@$params" \
            --parameters \
              environmentId="${{ steps.base.outputs.environmentId }}" \
              acrLoginServer="${{ steps.base.outputs.acrLoginServer }}" \
              acrName="${{ steps.base.outputs.acrName }}" \
              imageTag="${{ github.sha }}" \
              postgresHost="${{ steps.base.outputs.postgresHost }}" \
              postgresDbName="${{ steps.base.outputs.postgresDbName }}" \
            --query properties.outputs.migrationJobName.value -o tsv)
          execution=$(az containerapp job start --name "$job" --resource-group "$RESOURCE_GROUP" \
            --query name -o tsv)
          if [[ -z "$execution" ]]; then
            echo "::error::Azure did not return a migration execution name"
            exit 1
          fi
          echo "Migration execution: $execution"
          for attempt in {1..102}; do
            status=$(az containerapp job execution show --name "$job" --resource-group "$RESOURCE_GROUP" \
              --job-execution-name "$execution" --query properties.status -o tsv)
            case "$status" in
              Succeeded) exit 0 ;;
              Failed|Stopped|Canceled|Cancelled|Degraded)
                echo "::error::Migration $execution ended with status $status"
                exit 1
                ;;
            esac
            sleep 5
          done
          echo "::error::Timed out waiting for migration $execution"
          exit 1

      # Revisions are deployed only after this execution has succeeded.
      - name: Deploy container apps
        env:
          RESOURCE_GROUP: ${{ secrets.RESOURCE_GROUP }}
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          POSTGRES_AUTH_PASSWORD: ${{ secrets.POSTGRES_AUTH_PASSWORD }}
          POSTGRES_CATEGORIES_PASSWORD: ${{ secrets.POSTGRES_CATEGORIES_PASSWORD }}
          POSTGRES_TRANSACTIONS_PASSWORD: ${{ secrets.POSTGRES_TRANSACTIONS_PASSWORD }}
          RETAIN_LEGACY_DB_SECRET: ${{ vars.RETAIN_LEGACY_DB_SECRET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
        run: |
          params=$(mktemp "$RUNNER_TEMP/apps-params.XXXXXX.json")
          trap 'rm -f "$params"' EXIT
          jq -n '{
            "$schema": "https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#",
            contentVersion: "1.0.0.0",
            parameters: {
              postgresAuthPassword: {value: env.POSTGRES_AUTH_PASSWORD},
              postgresCategoriesPassword: {value: env.POSTGRES_CATEGORIES_PASSWORD},
              postgresTransactionsPassword: {value: env.POSTGRES_TRANSACTIONS_PASSWORD},
              legacyPostgresAdminPassword: {
                value: (if env.RETAIN_LEGACY_DB_SECRET == "true" then env.POSTGRES_ADMIN_PASSWORD else "" end)
              },
              jwtSecret: {value: env.JWT_SECRET},
              internalApiKey: {value: env.INTERNAL_API_KEY}
            }
          }' > "$params"
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name "apps-${{ github.sha }}" \
            --template-file infra/apps.bicep \
            --parameters "@$params" \
            --parameters \
              environmentId="${{ steps.base.outputs.environmentId }}" \
              acrLoginServer="${{ steps.base.outputs.acrLoginServer }}" \
              acrName="${{ steps.base.outputs.acrName }}" \
              imageTag="${{ github.sha }}" \
              postgresHost="${{ steps.base.outputs.postgresHost }}" \
              postgresDbName="${{ steps.base.outputs.postgresDbName }}" \
            --output none

      - name: Output gateway URL
        run: |
          URL=$(az deployment group show \
            --resource-group "${{ secrets.RESOURCE_GROUP }}" \
            --name "apps-${{ github.sha }}" \
            --query properties.outputs.gatewayUrl.value -o tsv)
          echo "### Deployed 🎉" >> "$GITHUB_STEP_SUMMARY"
          echo "Gateway: $URL" >> "$GITHUB_STEP_SUMMARY"
