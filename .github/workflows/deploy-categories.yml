name: Deploy Categories Service

on:
  push:
    branches: [master]
    paths:
      - 'services/categories/**'
      - '.github/workflows/deploy-categories.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: services/categories/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: services/categories

      - name: Run tests
        run: npm test -- --passWithNoTests
        working-directory: services/categories

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build and push Docker image
        run: |
          docker build services/categories \
            -t ${{ secrets.ACR_NAME }}.azurecr.io/categories:${{ github.sha }} \
            -t ${{ secrets.ACR_NAME }}.azurecr.io/categories:latest
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/categories:${{ github.sha }}
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/categories:latest

      - name: Update Container App
        run: |
          az containerapp update \
            --name ca-categories \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --image ${{ secrets.ACR_NAME }}.azurecr.io/categories:${{ github.sha }}
