name: Deploy Gateway (Nginx)

on:
  push:
    branches: [master]
    paths:
      - 'gateway/**'
      - '.github/workflows/deploy-gateway.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build and push Docker image
        run: |
          docker build gateway \
            -t ${{ secrets.ACR_NAME }}.azurecr.io/gateway:${{ github.sha }} \
            -t ${{ secrets.ACR_NAME }}.azurecr.io/gateway:latest
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/gateway:${{ github.sha }}
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/gateway:latest

      - name: Update Container App
        run: |
          az containerapp update \
            --name ca-gateway \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --image ${{ secrets.ACR_NAME }}.azurecr.io/gateway:${{ github.sha }}
