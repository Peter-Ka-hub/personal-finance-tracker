events {
  worker_connections 1024;
}

http {
  # Upstream hostnames are resolved via environment variables (see Dockerfile).
  # Locally (docker-compose): auth:3001, categories:3002, transactions:3003
  # On Azure Container Apps:  same names work because services are internal
  #                           within the same Container Apps Environment.

  upstream auth_service {
    server ${AUTH_HOST}:${AUTH_PORT};
  }

  upstream category_service {
    server ${CATEGORIES_HOST}:${CATEGORIES_PORT};
  }

  upstream transaction_service {
    server ${TRANSACTIONS_HOST}:${TRANSACTIONS_PORT};
  }

  server {
    listen 80;

    location /health {
      return 200 '{"status":"ok","service":"gateway"}';
      add_header Content-Type application/json;
    }

    location /api/auth/ {
      proxy_pass http://auth_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Request-ID $request_id;
    }

    location /api/categories {
      proxy_pass http://category_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Request-ID $request_id;
    }

    location /api/transactions {
      proxy_pass http://transaction_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Request-ID $request_id;
    }

    location / {
      return 404 '{"error":"not found"}';
      add_header Content-Type application/json;
    }
  }
}
