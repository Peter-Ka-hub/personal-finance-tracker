events {
  worker_connections 1024;
}

http {
  # Upstream host/port/scheme come from environment variables (see Dockerfile),
  # substituted at container start with envsubst.
  #
  # Local (docker-compose):  scheme=http,  <service>:<port>   e.g. http://auth:3001
  # Azure Container Apps:     scheme=https, <app>.internal.<env-domain>:443
  #
  # Notes for Azure:
  #  - Container Apps' internal ingress requires HTTPS (HTTP returns 426), so the
  #    gateway talks to services over https on 443.
  #  - The proxied "Host" header (and TLS SNI) must equal the upstream FQDN so the
  #    ingress routes to the right app. Locally this is just the compose service
  #    name, which Express ignores.
  #  - proxy_ssl_server_name sends SNI = the proxy_pass host; it is a no-op for
  #    http upstreams (docker-compose), so the same config works in both worlds.

  # Azure Container Apps' ingress (Envoy) rejects HTTP/1.0 with "426 Upgrade
  # Required". nginx proxies with HTTP/1.0 by default, so force 1.1 (and clear
  # the Connection header so keep-alive works).
  proxy_http_version 1.1;
  proxy_set_header Connection "";

  server {
    listen 80;

    location /health {
      return 200 '{"status":"ok","service":"gateway"}';
      add_header Content-Type application/json;
    }

    location /api/auth/ {
      proxy_pass ${UPSTREAM_SCHEME}://${AUTH_HOST}:${AUTH_PORT};
      proxy_ssl_server_name on;
      proxy_set_header Host ${AUTH_HOST};
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
    }

    location /api/categories {
      proxy_pass ${UPSTREAM_SCHEME}://${CATEGORIES_HOST}:${CATEGORIES_PORT};
      proxy_ssl_server_name on;
      proxy_set_header Host ${CATEGORIES_HOST};
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
    }

    location /api/transactions {
      proxy_pass ${UPSTREAM_SCHEME}://${TRANSACTIONS_HOST}:${TRANSACTIONS_PORT};
      proxy_ssl_server_name on;
      proxy_set_header Host ${TRANSACTIONS_HOST};
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
    }

    location / {
      proxy_pass ${UPSTREAM_SCHEME}://${FRONTEND_HOST}:${FRONTEND_PORT};
      proxy_ssl_server_name on;
      proxy_set_header Host ${FRONTEND_HOST};
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
    }
  }
}
