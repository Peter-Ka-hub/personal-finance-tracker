events {
  worker_connections 1024;
}

http {
  # Upstream hostnames/ports come from environment variables (see Dockerfile),
  # substituted at container start with envsubst.
  #
  # Local (docker-compose):  <service>:<internal-port>, e.g. auth:3001
  # Azure Container Apps:     <app>.internal.<env-domain>:80  (allowInsecure http)
  #
  # IMPORTANT: the proxied "Host" header must equal the upstream hostname so that
  # Azure Container Apps' ingress can route the request to the right app. Locally
  # the value is just the compose service name, which Express happily ignores.

  upstream auth_service {
    server ${AUTH_HOST}:${AUTH_PORT};
  }

  upstream category_service {
    server ${CATEGORIES_HOST}:${CATEGORIES_PORT};
  }

  upstream transaction_service {
    server ${TRANSACTIONS_HOST}:${TRANSACTIONS_PORT};
  }

  upstream frontend_service {
    server ${FRONTEND_HOST}:${FRONTEND_PORT};
  }

  server {
    listen 80;

    location /health {
      return 200 '{"status":"ok","service":"gateway"}';
      add_header Content-Type application/json;
    }

    location /api/auth/ {
      proxy_pass http://auth_service;
      proxy_set_header Host ${AUTH_HOST};
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
    }

    location /api/categories {
      proxy_pass http://category_service;
      proxy_set_header Host ${CATEGORIES_HOST};
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
    }

    location /api/transactions {
      proxy_pass http://transaction_service;
      proxy_set_header Host ${TRANSACTIONS_HOST};
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
    }

    location / {
      proxy_pass http://frontend_service;
      proxy_set_header Host ${FRONTEND_HOST};
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
    }
  }
}
